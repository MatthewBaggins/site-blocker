<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 14px system-ui;
        width: 260px;
        padding: 8px;
      }
      ul {
        padding-left: 0;
        list-style: none;
      }
      li {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      li span {
        flex: 1;
      }
      li button {
        padding: 2px 6px;
      }
      details {
        margin-top: 12px;
        padding: 8px;
        background: #f5f5f5;
        border-radius: 4px;
      }
      summary {
        cursor: pointer;
        font-weight: bold;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <input id="site" placeholder="example.com" />
    <button id="add">Add</button>
    <button id="blockCurrent">Block Current Site</button>
    <button id="reset">Reset to Defaults</button>
    <ul id="list"></ul>
    <details>
      <summary>Manage Defaults</summary>
      <input id="defaultSite" placeholder="example.com" />
      <button id="addDefault">Add Default</button>
      <button id="addCurrentToDefaults">Add Current Site</button>
      <ul id="defaultList"></ul>
    </details>
    <script src="dist/popup.js"></script>
  </body>
</html>
